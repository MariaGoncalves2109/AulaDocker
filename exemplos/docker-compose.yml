services:
  # DB*****************************************
  pgserver:
    image: postgres:17
    container_name: pgserver
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5432:5432
    # Se a porta 5432 já estiver ocupada:
    # - 5433:5432
    networks:
      - dbnet
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
    restart: unless-stopped

  # APP*****************************************
  springbootapp:
    image: hello-world-app:latest
    build:
      context: .
    container_name: java_app
    restart: unless-stopped
    depends_on:
      - pgserver
    networks:
      - dbnet
    ports:
      - 8080:8080
    command: /bin/bash

volumes:
  postgres-data:

networks:
  dbnet:
    driver: bridge
